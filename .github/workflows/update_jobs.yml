name: Update graduate jobs

on:
  workflow_dispatch:
  push:
    paths:
      - "collector_*.py"
      - "priority_jobs.json"
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: launchboard-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refresh jobs feed
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python collector_combined.py

      - name: Commit updated feed
        run: |
          git config user.name "launchboard-bot"
          git config user.email "launchboard-bot@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh graduate jobs"
          git push
