name: Update graduate jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh jobs feed
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python collector_adzuna.py

      - name: Commit updated feed
        run: |
          git config user.name "launchboard-bot"
          git config user.email "launchboard-bot@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh graduate jobs"
          git push
