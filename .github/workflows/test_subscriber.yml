name: Test private subscription gateway

on:
  push:
    paths:
      - "subscriber/**"
      - ".github/workflows/test_subscriber.yml"
  pull_request:
    paths:
      - "subscriber/**"
      - ".github/workflows/test_subscriber.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify paywall and cancellation rules
        run: node --test subscriber/subscriber.test.mjs
